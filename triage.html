<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Panel de Curaduría Rápida</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4">

  <!-- Header -->
  <header class="flex justify-between items-center border-b border-slate-800 pb-3">
    <div>
      <h1 class="font-bold text-sm text-sky-400">Curaduría de Oportunidades</h1>
      <p class="text-[11px] text-slate-400" id="status-counter">Cargando cola de revisión...</p>
    </div>
    <button onclick="loadPending()" class="text-xs bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-lg text-slate-300">🔄 Recargar</button>
  </header>

  <!-- Tarjeta Actual -->
  <main class="my-auto py-4" id="main-container">
    <div class="text-center py-12 text-slate-500 text-sm">Cargando pendientes...</div>
  </main>

  <!-- Botones de Acción Gigantes -->
  <footer class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-800" id="footer-actions">
    <button onclick="procesarNoticia('Descartado')" class="bg-red-600/20 border border-red-500/40 text-red-400 py-3.5 rounded-xl font-bold text-sm active:scale-95 transition">
      ❌ DESCARTAR
    </button>
    <button onclick="procesarNoticia('Aprobado')" class="bg-emerald-600/20 border border-emerald-500/40 text-emerald-400 py-3.5 rounded-xl font-bold text-sm active:scale-95 transition">
      🟩 APROBAR
    </button>
  </footer>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Extiende la WebApp a pantalla completa en Telegram

    const API_URL = "https://script.google.com/macros/s/AKfycbznDTcyQRqjHnAYAPwsGswZhvKn1CoBgVQlFGcEJZj0mF3poFolAgicTiqa4LYrx_UkBg/exec";
    let pendingList = [];
    let currentIndex = 0;

    async function loadPending() {
      document.getElementById('main-container').innerHTML = '<div class="text-center py-12 text-slate-500 text-sm">Buscando noticias...</div>';
      try {
        const res = await fetch(`${API_URL}?action=obtener_pendientes`);
        pendingList = await res.json();
        currentIndex = 0;
        renderCurrentCard();
      } catch (e) {
        document.getElementById('main-container').innerHTML = '<div class="text-center text-red-400 text-sm">Error al conectar con la base de datos.</div>';
      }
    }

    function renderCurrentCard() {
      const counter = document.getElementById('status-counter');
      const container = document.getElementById('main-container');

      if (!pendingList || pendingList.length === 0 || currentIndex >= pendingList.length) {
        counter.innerText = "Cola vacía";
        container.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center">
            <p class="text-3xl mb-2">🎉</p>
            <h2 class="font-bold text-slate-200 text-base mb-1">¡Al día!</h2>
            <p class="text-xs text-slate-400">No hay más oportunidades pendientes de revisión.</p>
          </div>
        `;
        document.getElementById('footer-actions').classList.add('hidden');
        return;
      }

      document.getElementById('footer-actions').classList.remove('hidden');
      const item = pendingList[currentIndex];
      counter.innerText = `Noticia ${currentIndex + 1} de ${pendingList.length}`;

      container.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
          <div class="flex justify-between items-center text-[10px]">
            <span class="font-bold uppercase tracking-wider bg-sky-950 text-sky-400 px-2.5 py-1 rounded border border-sky-800/50">${item.categoria}</span>
            <span class="text-slate-400">${item.fecha}</span>
          </div>

          <h2 class="font-bold text-slate-100 text-base leading-snug">${item.titulo}</h2>
          
          <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-3 text-xs text-slate-300 space-y-2 max-h-48 overflow-y-auto">
            <p>${item.borrador.replace(/\n/g, '<br>')}</p>
          </div>

          <div class="pt-2 flex justify-between items-center text-xs">
            <span class="text-amber-400 font-medium">⏳ Cierra: ${item.fecha_limite}</span>
            <a href="${item.link}" target="_blank" class="text-sky-400 font-semibold underline">Ver enlace ↗</a>
          </div>
        </div>
      `;
    }

    async function procesarNoticia(nuevoEstado) {
      if (currentIndex >= pendingList.length) return;
      
      const item = pendingList[currentIndex];
      
      // Pasar a la siguiente visualmente de inmediato (UI optimista)
      currentIndex++;
      renderCurrentCard();

      // Enviar actualización a Sheets en segundo plano
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'cambiar_estado',
            row_id: item.row,
            estado: nuevoEstado
          })
        });
      } catch (e) {
        console.error("Error actualizando estado:", e);
      }
    }

    loadPending();
  </script>
</body>
</html>
